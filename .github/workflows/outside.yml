# Disposable test: a GitHub job joins the tailnet through a federated identity and reaches svc:openbao.
name: tailnet
on:
  push:
permissions:
  id-token: write
  contents: read
jobs:
  join:
    runs-on: ubuntu-24.04
    steps:
      - name: Join the tailnet with the job's own GitHub token
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: TJqYefgm8i11CNTRL-kKxiMZ1aX521CNTRL
          audience: api.tailscale.com/TJqYefgm8i11CNTRL-kKxiMZ1aX521CNTRL
          tags: tag:iac-ci-test
      - name: Show this machine on the tailnet
        run: |
          echo "REPO: $GITHUB_REPOSITORY"
          tailscale version | head -1
          tailscale status --json | jq -c '.Self | {HostName, Tags, Online, ips: .TailscaleIPs}'
      - name: Reach OpenBao through its Tailscale Service
        run: |
          code=$(curl -s -o /tmp/h.json -w '%{http_code}' --max-time 20 https://openbao.tail4cf2f3.ts.net/v1/sys/health)
          echo "OPENBAO: HTTP $code $(jq -c '{initialized, sealed, version}' /tmp/h.json 2>/dev/null)"
